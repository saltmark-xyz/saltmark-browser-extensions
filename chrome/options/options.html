<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="settingsTitle">SaltMark</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/favicon-32.png" alt="" width="32" height="32">
        <h1 data-i18n="settingsTitle">SaltMark</h1>
      </header>
      <label class="setting-row">
        <input id="silent-mode" type="checkbox">
        <span data-i18n="saveToUnsortedLabel">Save to Unsorted</span>
      </label>
      <button id="open-shortcut-settings" type="button"
              data-i18n="shortcutButton">Configure Keyboard Shortcut</button>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
